name: Generate and publish JaxFit illustrated recipe covers
on:
  push:
    paths:
      - 'scripts/generate_covers.py'
      - '.github/workflows/generate-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Render 1080 lightweight WebP covers
        run: python scripts/generate_covers.py
      - name: Validate complete asset set
        run: python scripts/validate_content.py
      - name: Commit generated WebP images and ready indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/content
          if ! git diff --cached --quiet; then
            git commit -m "assets(v1): publish 1080 illustrated WebP recipe covers"
            git push
          fi
